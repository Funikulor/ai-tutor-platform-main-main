services:
  # Backend API (FastAPI)
  - type: web
    name: adapted-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r AdaptEd/backend/requirements.txt
    startCommand: cd AdaptEd/backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    rootDir: AdaptEd/backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Установите вручную в панели Render
      - key: ASSISTANT_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false  # Установите вручную в панели Render
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    healthCheckPath: /

# Если используете PostgreSQL на Render
# databases:
#   - name: adapted-db
#     databaseName: adapted_db
#     user: adapted_user
#     plan: free

