[build]
  # Команда сборки frontend
  command = "cd AdaptEd/frontend && npm install && npm run build"
  
  # Директория с собранными файлами
  publish = "AdaptEd/frontend/build"

[build.environment]
  # Версия Node.js для frontend
  NODE_VERSION = "20"
  # Версия Python для backend functions
  PYTHON_VERSION = "3.11"

# Проксирование API запросов к Netlify Functions (должно быть ПЕРЕД SPA редиректом)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Редирект для SPA (React Router) - должен быть последним
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

