[build]
  # Базовая директория для сборки frontend
  base = "AdaptEd/frontend"
  
  # Команда сборки frontend
  command = "npm install && npm run build"
  
  # Директория с собранными файлами (относительно base)
  publish = "build"

[build.environment]
  # Версия Node.js для frontend
  NODE_VERSION = "20"
  # Укажите URL вашего backend на Render
  # После деплоя backend на Render замените на реальный URL
  VITE_API_URL = "https://adapted-backend.onrender.com"

# Редирект для SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

